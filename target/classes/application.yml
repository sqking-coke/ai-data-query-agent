# =====================================================
# application.yml
# =====================================================
server:
  port: 8080

spring:
  application:
    name: ai-data-query-agent

  datasource:
    url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0

# =====================================================
# 大模型配置（兼容OpenAI格式接口）
# 支持：通义千问、DeepSeek、讯飞星火、本地Ollama等
# =====================================================
llm:
  # API地址（OpenAI兼容格式）
  api-url: https://api.deepseek.com
  # API密钥
  api-key: sk-6ccd315841c54d8d98fe59d05b53d8d5
  # 模型名称（deepseek-chat / qwen-turbo / gpt-3.5-turbo 等）
  model: deepseek-v4-flash
  # 最大输出Token数
  max-tokens: 2048
  # 温度参数（0.0~2.0, 越低越确定）
  temperature: 0.1
  # 请求超时时间（毫秒）
  timeout: 60000
  # 最大重试次数
  max-retries: 2

# 日志配置
logging:
  level:
    com.aiagent: DEBUG
    com.aiagent.mapper: INFO